<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">Прапор України — анімований шовковий прапор</title>
  <desc id="desc">Синьо-жовтий прапор України з плавними хвилястими контурами, м’якими складками та рухом тканини.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0.08" y2="1"><stop offset="0" stop-color="#1684e8"/><stop offset=".48" stop-color="#0870d0"/><stop offset="1" stop-color="#034a9e"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2=".08" y2="1"><stop offset="0" stop-color="#ffe66a"/><stop offset=".48" stop-color="#ffd52e"/><stop offset="1" stop-color="#e9a900"/></linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2=".12"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".13" stop-color="#fff" stop-opacity=".03"/><stop offset=".29" stop-color="#061c42" stop-opacity=".18"/><stop offset=".43" stop-color="#fff" stop-opacity=".14"/><stop offset=".59" stop-color="#061c42" stop-opacity=".24"/><stop offset=".76" stop-color="#fff" stop-opacity=".1"/><stop offset=".9" stop-color="#061c42" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#061b40" stop-opacity=".36"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".02"/><stop offset=".58" stop-color="#fff" stop-opacity=".4"/><stop offset=".7" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <path id="blue-field" d="M22 205 C75 187 123 217 183 200 C245 183 293 219 350 201 C408 184 466 193 581 209 C580 160 593 96 585 70 C586 59 581 52 572 50 C463 34 405 25 348 43 C291 61 244 27 183 43 C125 58 82 27 28 48 C22 51 20 55 19 62 C12 101 32 143 22 193 Z"/>
    <path id="yellow-field" d="M22 205 C75 187 123 217 183 200 C245 183 293 219 350 201 C408 184 466 193 581 209 C571 265 592 307 579 356 C576 369 569 374 557 371 C475 352 428 385 359 369 C294 354 246 385 183 369 C124 354 82 385 31 364 C19 359 15 350 18 337 C29 283 12 244 22 205 Z"/>
    <path id="cloth" d="M28 48 C82 27 125 58 183 43 C244 27 291 61 348 43 C405 25 463 34 572 50 C581 52 586 59 585 70 C580 126 593 164 581 209 C593 264 571 306 579 356 C576 369 569 374 557 371 C475 352 428 385 359 369 C294 354 246 385 183 369 C124 354 82 385 31 364 C19 359 15 350 18 337 C29 283 12 244 22 193 C32 143 12 101 19 62 C20 55 22 51 28 48 Z"/>
  </defs>
  <g class="flag-shadow" opacity=".22"><use href="#cloth" fill="#000" transform="translate(0 9)"/></g>
  <g class="fabric">
    <use href="#blue-field" fill="url(#blue)"/>
    <use href="#yellow-field" fill="url(#yellow)"/>
    <use href="#cloth" fill="url(#silk)"/>
    <path class="fold fold-a" d="M75 78 C145 142 102 245 158 323" fill="none" stroke="#071d43" stroke-width="27" stroke-linecap="round" opacity=".12"/>
    <path class="fold fold-b" d="M260 78 C320 145 282 245 335 325" fill="none" stroke="#fff" stroke-width="25" stroke-linecap="round" opacity=".1"/>
    <path class="fold fold-c" d="M435 78 C493 145 450 245 493 325" fill="none" stroke="#061b40" stroke-width="29" stroke-linecap="round" opacity=".14"/>
    <path d="M30 198 C100 184 145 213 205 197 S320 213 390 196 S500 192 570 207" fill="none" stroke="#fff" stroke-opacity=".11" stroke-width="6"/>
    <path class="glint" d="M48 70 C140 145 78 252 145 350" fill="none" stroke="url(#shine)" stroke-width="25" stroke-linecap="round" opacity=".55"/>
    <use href="#cloth" fill="none" stroke="url(#edge)" stroke-width="3.5"/>
    <path d="M29 49 C83 29 126 60 184 45 C244 29 292 63 349 45 C407 27 464 36 571 52" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M30 365 C83 386 125 356 184 371 C246 387 294 356 359 371 C429 387 475 354 557 373" fill="none" stroke="#061b40" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
  </g>
  <style>
    .fabric { transform-box: fill-box; transform-origin: 4% 50%; animation: flag-sail 4.8s ease-in-out infinite; }
    .fold-a { animation: fold-a 4.8s ease-in-out infinite; }.fold-b { animation: fold-b 4.8s ease-in-out infinite; }.fold-c { animation: fold-c 4.8s ease-in-out infinite; }.glint { animation: glimmer 6.4s ease-in-out infinite; }
    @keyframes flag-sail { 0%,100% { transform: translateX(0) rotate(-.35deg) skewY(-.25deg) scaleX(.995); } 28% { transform: translateX(2px) rotate(.45deg) skewY(.45deg) scaleX(.985); } 56% { transform: translateX(0) rotate(-.2deg) skewY(-.5deg) scaleX(1); } 78% { transform: translateX(1px) rotate(.3deg) skewY(.25deg) scaleX(.99); } }
    @keyframes fold-a { 0%,100% { opacity:.12; transform:translateX(-5px); } 50% { opacity:.2; transform:translateX(8px); } }@keyframes fold-b { 0%,100% { opacity:.1; transform:translateX(8px); } 50% { opacity:.18; transform:translateX(-8px); } }@keyframes fold-c { 0%,100% { opacity:.14; transform:translateX(5px); } 50% { opacity:.22; transform:translateX(-6px); } }@keyframes glimmer { 0%,25% { opacity:0; stroke-dasharray:0 800; } 45% { opacity:.55; stroke-dasharray:300 800; } 75%,100% { opacity:0; stroke-dasharray:800 0; } }
    @media (prefers-reduced-motion: reduce) { .fabric,.fold-a,.fold-b,.fold-c,.glint { animation:none !important; } }
  </style>
</svg>