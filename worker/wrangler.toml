name = "sho-po-svitlu-api"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
DEFAULT_CHANNEL = "SvitloMalovyskivskohoRaionu"

# Namespace in Cloudflare Dashboard: sho-po-svitlu-schedules
[[kv_namespaces]]
binding = "KV_BINDING"
id = "2c01d95203644d18b5091ebc1427b55a"

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "COMPLETED_SETUP_COUNTER"
class_name = "CompletedSetupCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CompletedSetupCounter"]
